name: Build and publish BeagleEditor

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-beagleeditor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: mac-arm64

          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: mac-intel

          - platform: ubuntu-22.04
            args: ''
            name: linux

          - platform: windows-latest
            args: ''
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run tauri build ${{ matrix.args }}

      - name: Upload bundled installers
        uses: actions/upload-artifact@v4
        with:
          name: beagleeditor-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/**/*
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-beagleeditor
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: beagleeditor-*
          path: release-artifacts

      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            # The artifact folder identifies the platform and prevents filename collisions.
            artifact="$(printf '%s' "$file" | sed 's#^release-artifacts/##' | cut -d/ -f1)"
            cp "$file" "release-assets/${artifact}-$(basename "$file")"
          done < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) -print0)
          test -n "$(find release-assets -type f -print -quit)" || { echo 'No installer bundles were produced.' >&2; exit 1; }
          ls -lh release-assets

      - name: Publish release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          name: BeagleEditor ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
